# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "09fe27e7030a957490451dbf826afc47"
name = "Legends BAGS Dev"
application_url = "https://upload-by-size-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders/updated"

[access_scopes]
# Minimal Phase 1 scopes — expand only with documented need
scopes = "read_products,write_products,read_orders,read_themes"

[auth]
redirect_urls = [
  "https://upload-by-size-production.up.railway.app/auth/callback",
  "https://upload-by-size-production.up.railway.app/auth",
]

[app_proxy]
url = "/apps/legends-bags"
subpath = "legends-bags"
prefix = "apps"
